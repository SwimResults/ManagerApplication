<div class="log-container">
    <h3>Import Logs</h3>
    <div class="log-list" *ngIf="logs.length > 0">
        <div class="log-entry"
             *ngFor="let log of getReversedLogs(); trackBy: trackByIndex"
             [class]="'level-' + log.level.toLowerCase()">
            <mat-icon class="log-icon">{{ getLogIcon(log.level) }}</mat-icon>
            <div class="log-content">
                <span class="log-timestamp">{{ formatTimestamp(log.timestamp) }}</span>
                <span class="log-message">{{ log.message }}</span>
            </div>
        </div>
    </div>
    <div class="log-placeholder" *ngIf="logs.length === 0">
        <p>Noch keine Logs vorhanden. Starte einen Import, um Logs zu sehen.</p>
    </div>
</div>
