<div class="progress-container" *ngIf="progress">
    <div class="progress-header">
        <h3>Import Fortschritt</h3>
        <span class="progress-percentage">{{ getPercentage() }}%</span>
    </div>
    <mat-progress-bar
        mode="determinate"
        [value]="getPercentage()">
    </mat-progress-bar>
    <div class="progress-details">
        <span class="progress-message">{{ getMessage() }}</span>
        <span class="progress-count" *ngIf="progress.current && progress.total">{{ progress.current }} / {{ progress.total }}</span>
    </div>
</div>

<div class="progress-placeholder" *ngIf="!progress">
    <p>Kein Import im Gange</p>
</div>
