<div class="app" [ngClass]="{'display-mode': isDisplayRoute()}">
  @if (!isDisplayRoute()) {
    <app-header></app-header>
    <app-sidebar></app-sidebar>
  }

  <main>
    @if (!isDisplayRoute()) {
      <as-split direction="vertical" unit="percent">
        <as-split-area [size]="70">
          <as-split direction="horizontal" unit="percent">
            <as-split-area [size]="70">
              <router-outlet></router-outlet>
            </as-split-area>
            <as-split-area [size]="30">
              <sr-import-stream-view></sr-import-stream-view>
            </as-split-area>
          </as-split>
        </as-split-area>
        <as-split-area [size]="30">
            <sr-live-timing-view></sr-live-timing-view>
        </as-split-area>
      </as-split>
    } @else {
      <router-outlet></router-outlet>
    }
  </main>

  @if (!isDisplayRoute()) {
    <app-status-bar></app-status-bar>
  }
</div>
