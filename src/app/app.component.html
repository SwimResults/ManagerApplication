<div class="app" [ngClass]="{'display-mode': isDisplayMode}">
  @if (!isDisplayMode) {
    <app-header></app-header>
    <app-sidebar></app-sidebar>
  }

  <main>
    @if (!isDisplayMode) {
      <as-split direction="vertical" unit="percent">
        <as-split-area [size]="70">
          <as-split direction="horizontal" unit="percent" *srActiveViewMode="['advanced', 'expert']">
            <as-split-area [size]="70">
              <router-outlet></router-outlet>
            </as-split-area>
            <as-split-area [size]="30">
              <sr-import-stream-view></sr-import-stream-view>
            </as-split-area>
          </as-split>
            <ng-container *srActiveViewMode="['simple']">
                <router-outlet></router-outlet>
            </ng-container>
        </as-split-area>
        <as-split-area class="live-table" [size]="30">
            <sr-live-timing-view></sr-live-timing-view>
        </as-split-area>
      </as-split>
    } @else {
      <router-outlet></router-outlet>
    }
  </main>

  @if (!isDisplayMode) {
    <app-status-bar></app-status-bar>
  }
</div>
